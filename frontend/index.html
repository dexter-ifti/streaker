<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- SEO Meta Tags -->
    <meta name="description" content="Track your daily streaks and build lasting habits with Streaker - your personal habit tracking companion" />
    <meta name="keywords" content="habit tracker, streak counter, daily habits, productivity, goal tracking, habit building" />
    <meta name="author" content="Taha Iftikhar" />
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="Streaker - Build Better Habits" />
    <meta property="og:description" content="Track your daily streaks and build lasting habits with Streaker" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://streaker.ifti.tech" />
    <meta property="og:image" content="https://streaker.ifti.tech/icons/favicon/icon-192x192.png" />
    
    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Streaker - Build Better Habits" />
    <meta name="twitter:description" content="Track your daily streaks and build lasting habits with Streaker" />
    <meta name="twitter:image" content="https://streaker.ifti.tech/icons/favicon/icon-192x192.png" />
    
    <!-- Existing Tags -->
    <link rel="icon" type="image/svg+xml" href="./icons/favicon/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#feecf5" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Set the theme before first paint to avoid a flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('streaker-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          var root = document.documentElement;
          if (theme === 'dark') root.classList.add('dark');
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#161320' : '#feecf5');
        } catch (e) { /* no-op: fall back to light */ }
      })();
    </script>
    <title>Streaker - Build Better Habits</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
